services:
  - type: web
    name: whatsapp-web-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.puppeteer_cache
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: true
